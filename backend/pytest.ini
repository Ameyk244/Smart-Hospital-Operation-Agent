[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: requires a running Postgres (docker compose up -d postgres)
    live_llm: makes a real LLM API call; gated behind RUN_LIVE_LLM_TESTS=1
    adversarial: deliberately malformed/hostile input, proving rejection happens in code
testpaths = tests
