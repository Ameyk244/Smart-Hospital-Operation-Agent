services:
  - type: web
    name: ameyk244-smart-hospital-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed.seed_data --if-empty && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: ameyk244-smart-hospital-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://ameyk244-agentic-smart-hospital-web.onrender.com
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ENABLE_JEV_FAST_PATH
        value: true
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_MODEL
        value: jev-latest
      - key: JEV_CONFIDENCE_THRESHOLD
        value: 0.9
      - key: JEV_TIMEOUT_SECONDS
        value: 5.0
      - key: MAX_AGENT_ROUNDS
        value: 6
      - key: MAX_TOOL_CALLS
        value: 10
      - key: MAX_INVALID_TOOL_CALLS
        value: 3
      - key: TOOL_TIMEOUT_SECONDS
        value: 15
      - key: LLM_TIMEOUT_SECONDS
        value: 30

  - type: web
    name: ameyk244-agentic-smart-hospital-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        value: https://ameyk244-smart-hospital-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ameyk244-smart-hospital-db
    databaseName: hospital_ops
    user: hospital_admin
    plan: free
    region: singapore
    ipAllowList: []
